<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JendellBook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f0;--surface:#fff;--ink:#15303a;--muted:#566b72;--line:#d3ddd9;--jade:#2c7a6a;--on-jade:#fff;--gold:#946414;--bad:#a8402f;--chip:#e3ece8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d22;--surface:#17292f;--ink:#e6efec;--muted:#9bb0b0;--line:#2a4046;--jade:#4fb39d;--on-jade:#0f1d22;--gold:#e0b25a;--bad:#e8806e;--chip:#1f363d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1d22;--surface:#17292f;--ink:#e6efec;--muted:#9bb0b0;--line:#2a4046;--jade:#4fb39d;--on-jade:#0f1d22;--gold:#e0b25a;--bad:#e8806e;--chip:#1f363d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:16px max(20px,5vw);border-bottom:1px solid var(--line);background:var(--surface)}
.brand{font:700 26px/1 Fraunces,Georgia,serif;letter-spacing:-.01em}
.brand small{display:block;font:400 13px "DM Sans",sans-serif;color:var(--muted);margin-top:4px;letter-spacing:0}
main{max-width:1000px;margin:0 auto;padding:28px max(20px,5vw) 80px}
h1{font:700 30px/1.15 Fraunces,Georgia,serif;margin:0 0 4px}
h2{font:700 20px/1.2 Fraunces,Georgia,serif;margin:0 0 12px}
h3{font:700 15px Fraunces,Georgia,serif;margin:16px 0 6px}
.lead{color:var(--muted);margin:0 0 24px;max-width:60ch}
.grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.panel.gap{margin-top:20px}
label{display:block;font-weight:500;font-size:14px;margin:14px 0 6px}
select,input[type=time],input[type=text],input[type=number],input[type=password],input[type=email],input[type=tel]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
input[type=file]{font-size:14px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--jade);color:var(--on-jade);border-color:var(--jade)}
.chip:disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed}
.btn{background:var(--jade);color:var(--on-jade);border:0;padding:11px 18px;border-radius:8px;font:700 15px inherit;font-family:inherit;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1px solid var(--line)}
.btn.bad{background:var(--bad);color:#fff}
.btn.sm{padding:7px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0;padding-top:0}
.row p{margin:2px 0;color:var(--muted);font-size:14px}
.row b{font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);white-space:nowrap}
.pill.Confirmed,.pill.Completed{background:var(--jade);color:var(--on-jade)}
.pill.Rejected,.pill.Cancelled{background:var(--bad);color:#fff}
.pill.Pending{background:var(--gold);color:#fff}
.empty{color:var(--muted);font-size:14px;margin:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-top:1px solid var(--line)}
th{font-weight:700;border-top:0}
.scroll{overflow-x:auto}
.proof{background:var(--bg);border-radius:10px;padding:12px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin-top:10px}
.auth{max-width:440px;margin:0 auto}
.seg{display:flex;gap:4px;background:var(--chip);padding:4px;border-radius:10px;margin-bottom:6px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:9px;border-radius:7px;font-weight:500;font-size:14px;font-family:inherit;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.bar{height:8px;border-radius:4px;background:var(--jade);min-width:2px}
.hold{color:var(--gold);font-weight:700}
.tag{font-size:13px;color:var(--bad);font-weight:700}
.who{display:flex;gap:12px;align-items:center;font-size:14px}.who span{color:var(--muted)}
.link{background:none;border:0;color:var(--jade);font:inherit;font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
.banner{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:9px 14px;font-size:13px;color:var(--muted);margin-bottom:20px}
.banner.ok{border-color:var(--jade);color:var(--ink)}
.banner.err{border-color:var(--bad);color:var(--bad)}
.prof{display:flex;gap:12px;align-items:center;margin-top:10px}.prof img,.ini{width:56px;height:56px;border-radius:50%;object-fit:cover}.ini{background:var(--chip);display:grid;place-items:center;font:700 22px Fraunces,Georgia,serif}
.thumb{display:block;max-width:150px;max-height:110px;border-radius:8px;border:1px solid var(--line);margin-top:8px;cursor:zoom-in}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;z-index:20}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:100%;border-radius:10px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;max-width:90vw;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <div class="brand">JendellBook<small>JENDELL Massage and Spa · online booking</small></div>
  <div id="tabs" class="who"></div>
</header>
<main id="app"><p class="empty">Loading…</p></main>
<div id="lightbox" role="dialog" aria-label="Payment screenshot" onclick="this.classList.remove('on')"><img alt="Payment screenshot"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="firebase-config.js"></script>
<script>
/* =====================================================================
   SETTINGS
   DEMO MODE (data saved in this browser) runs when there is no firebase-config.js next to this file.
   To use the real Firebase database, create public/firebase-config.js containing:
   window.FIREBASE_CONFIG = {apiKey:"...",authDomain:"...",projectId:"...",storageBucket:"...",messagingSenderId:"...",appId:"..."};
   ===================================================================== */
const FIREBASE_CONFIG = window.FIREBASE_CONFIG || null;   // set in firebase-config.js (next to this file)
/* Payment screenshots: false = keep a small compressed copy inside the booking record in Firestore (works on the free Spark plan).
   true = use Firebase Cloud Storage (needs the Blaze pay-as-you-go plan, and storage.rules published). */
const USE_CLOUD_STORAGE = false;

/* ---------------------------------------------------------------------
   Small helpers
   --------------------------------------------------------------------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>'x'+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const dkey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());       // local date, not UTC
const fmt=ms=>new Date(ms).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
const UNIT=15,STEP=30;                                    // a booking locks 15-minute units; start times are offered every 30 minutes
const toMin=t=>{const[h,m]=t.split(':').map(Number);return h*60+m};
const toHM=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const fmtMins=m=>m<60?m+' min':Math.floor(m/60)+' hr'+(m%60?' '+m%60+' min':'');
const LIVE=['Pending Payment','Pending Verification','Confirmed','Completed'];
const DEFAULTS={holdMin:30,cutoffH:2,verifyH:0,open:'10:00',lastStart:'21:30',earlyFrom:'10:00',earlyTo:'15:00',travelMin:0};   // verifyH: 0 = no time limit for staff once proof is sent; travelMin: buffer each way for home service
let _dc=null;
function days(){const k=dkey(new Date());if(_dc&&_dc.k===k)return _dc.v;
  const v=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return{key:dkey(d),label:d.toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}});
  _dc={k,v};return v}
const dayLabel=k=>(days().find(d=>d.key===k)||{label:k}).label;
const startMs=(date,time)=>{const[y,m,d]=date.split('-').map(Number),[h,i]=time.split(':').map(Number);return new Date(y,m-1,d,h,i).getTime()};
const isPast=(date,time)=>startMs(date,time)<=Date.now();

/* In-memory cache that the screens read from. The database adapters keep it live. */
const D={users:[],services:[],therapists:[],appointments:[],slots:{},notes:[],log:[],settings:{...DEFAULTS}};
const S={edit:null,user:null,mode:'client',reg:false,resch:null,ready:false,busy:false,fatal:null,race:false,thView:null,exp:new Set(),dirty:false,
  walk:{svc:null,th:null,day:null,time:null,name:''},sel:{svc:null,th:null,day:null,time:null}};
let DB=null;

const svc=id=>D.services.find(x=>x.id===id)||{name:'—',mins:60,price:0};
const thr=id=>D.therapists.find(x=>x.id===id)||{name:'—',spec:''};
const pill=s=>`<span class="pill ${s.split(' ')[0]}">${s}</span>`;

/* ---------------------------------------------------------------------
   Slot locking = conflict detection.
   Every hour a therapist works is a "slot" document with a deterministic id.
   A booking must create ALL the slot documents it needs inside ONE
   transaction; if any already exists (and is still live) the whole booking
   is rejected. That is what makes double-booking impossible.
   A 90-minute service locks two consecutive hours.
   --------------------------------------------------------------------- */
const slotId=(th,date,time)=>th+'_'+date+'_'+time.replace(':','');
const units=(th,date,time,mins)=>{const s=toMin(time),n=Math.ceil(mins/UNIT);return Array.from({length:n},(_,k)=>slotId(th,date,toHM(s+k*UNIT)))};
const DAYN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const wdayOf=date=>{const[y,m,d]=date.split('-').map(Number);return new Date(y,m-1,d).getDay()};
const blk=sv=>sv&&sv.home?{pre:+D.settings.travelMin||0,post:+D.settings.travelMin||0}:{pre:0,post:0};
function needed(th,date,time,sv){                      // the 15-minute units a booking must lock (home service adds travel time each way)
  const b=blk(sv),t=toMin(time);if(t<toMin(D.settings.open)||t>toMin(D.settings.lastStart))return null;
  const s0=t-b.pre,n=Math.ceil((sv.mins+b.pre+b.post)/UNIT);if(s0<0||s0+n*UNIT>1440)return null;
  return units(th,date,toHM(s0),n*UNIT)}
function times(){const r=[];for(let m=toMin(D.settings.open);m<=toMin(D.settings.lastStart);m+=STEP)r.push(toHM(m));return r}
const endHM=(time,mins)=>toHM(toMin(time)+mins);
const when=a=>dayLabel(a.date)+' · '+a.time+'–'+endHM(a.time,svc(a.svc).mins);
const isEarly=(date,time,mins)=>{const wd=wdayOf(date),t=toMin(time);return wd>=1&&wd<=5&&t>=toMin(D.settings.earlyFrom)&&t+mins<=toMin(D.settings.earlyTo)};   // must START after earlyFrom and FINISH by earlyTo
const priceAt=(sv,date,time)=>sv.promo&&date&&time&&isEarly(date,time,sv.mins)?sv.promo:sv.price;
const isOff=(th,date)=>((D.therapists.find(x=>x.id===th)||{}).off||[]).includes(wdayOf(date));
const offNote=(th,date)=>isOff(th,date)?`<p class="tag">${esc((D.therapists.find(x=>x.id===th)||{}).name)} has a day off on this day.</p>`:'';
const slotLive=l=>!!l&&(l.holdUntil==null||l.holdUntil>Date.now());
function free(th,date,time,sv,mine){
  const ids=needed(th,date,time,sv);if(!ids||isPast(date,time)||isOff(th,date))return false;
  return ids.every(i=>{const l=D.slots[i];return !slotLive(l)||(mine&&l.apptId===mine)})}
const lockDoc=(a,holdUntil)=>({apptId:a.id,th:a.th,date:a.date,holdUntil});
const note=(to,m,ph)=>({to,m:('JENDELL: '+m).slice(0,160),ph:ph||'',t:Date.now()});
const logDoc=a=>({at:Date.now(),by:S.user.name,role:S.user.role,a});

/* ---------------------------------------------------------------------
   Image helper: shrink a payment screenshot before it is stored
   --------------------------------------------------------------------- */
async function shrink(file,small,max){
  if(!/^image\//.test(file.type))throw new Error('notimage');
  const bmp=await createImageBitmap(file),sc=Math.min(1,(max||(small?640:900))/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',small?.55:.7));
  const url=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(blob)});
  return{blob,url}}

/* =====================================================================
   DATABASE ADAPTER 1: LOCAL (demo mode). Saved in this browser's storage.
   Same interface as the Firebase adapter, so the app code never changes.
   ===================================================================== */
const COLS=['users','services','therapists','appointments','slots','notes','log','settings'];
const LKEY='jendellbook.db.v1';
let memStore=null;                                    // used only if browser storage is blocked
const store={get(){try{return localStorage.getItem(LKEY)}catch(e){return memStore}},set(v){try{localStorage.setItem(LKEY,v)}catch(e){memStore=v}},clear(){try{localStorage.removeItem(LKEY)}catch(e){}memStore=null}};
async function sha(s){
  if(crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h=5381;for(const c of s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'weak'+h}      // fallback, demo only
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}},del:k=>{try{sessionStorage.removeItem(k)}catch(e){}}};
const Local={
  mode:'local',cb:()=>{},
  on(fn){this.cb=fn},
  load(){let o=null;try{o=JSON.parse(store.get())}catch(e){}if(!o)return null;COLS.forEach(c=>o[c]=o[c]||{});return o},
  async init(){if(!this.load())await this.seed();addEventListener('storage',e=>{if(e.key===LKEY)this.pull()});this.pull(true)},
  pull(silent){
    const db=this.load();if(!db)return;const arr=c=>Object.entries(db[c]).map(([id,o])=>({id,...o}));
    D.users=arr('users');D.services=arr('services');D.therapists=arr('therapists');D.appointments=arr('appointments');
    D.slots=db.slots;D.notes=arr('notes').sort((a,b)=>b.t-a.t);D.log=arr('log').sort((a,b)=>b.at-a.at).slice(0,100);
    D.settings={...DEFAULTS,...(db.settings.main||{})};if(!silent)this.cb()},
  async seed(){
    const db={};COLS.forEach(c=>db[c]={});
    db.services={s1:{name:'Swedish massage',mins:60,price:700,on:true},s2:{name:'Deep tissue massage',mins:60,price:850,on:true},s3:{name:'Hot stone therapy',mins:90,price:1200,on:true}};
    db.therapists={t1:{name:'Marites',spec:'Swedish, aromatherapy',on:true},t2:{name:'Joyce',spec:'Deep tissue, sports',on:true},t3:{name:'Lorna',spec:'Hot stone',on:true}};
    const mk=async(id,email,pw,name,role,extra)=>{const salt=uid();db.users[id]={email,name,role,salt,hash:await sha(salt+pw),...extra}};
    await mk('u1','demo@client.ph','client123','Maria Santos','client',{phone:'0917 000 0000'});
    await mk('u2','staff@jendell.ph','staff123','Front Desk','staff');
    await mk('u3','admin@jendell.ph','admin123','Owner','admin');
    await mk('u4','marites@jendell.ph','therapist123','Marites','therapist',{thId:'t1'});
    await mk('u5','joyce@jendell.ph','therapist123','Joyce','therapist',{thId:'t2'});
    await mk('u6','lorna@jendell.ph','therapist123','Lorna','therapist',{thId:'t3'});
    const today=dkey(new Date()),seedAppt=(id,who,sv,th,time)=>{const ids=units(th,today,time,60);
      db.appointments[id]={who,cid:null,ph:'',svc:sv,th,date:today,time,slots:ids,price:700,status:'Confirmed',holdUntil:null,proofs:[{ref:'GC'+id,file:'seed.png',url:'',st:'Verified'}],created:Date.now()};
      ids.forEach(s=>{db.slots[s]={apptId:id,th,date:today,holdUntil:null}})};
    seedAppt('a1','Ana R.','s2','t2','11:00');seedAppt('a2','Ben L.','s1','t1','13:00');
    db.settings.main={...DEFAULTS};this.save(db)},
  save(db){store.set(JSON.stringify(db))},
  async reset(){store.clear();await this.seed();this.pull()},
  /* auth */
  prof(id,u){return{uid:id,email:u.email,name:u.name,phone:u.phone||'',role:u.role,thId:u.thId||null}},
  async signIn(em,pw){const db=this.load(),e=Object.entries(db.users).find(([,u])=>u.email===em);
    if(!e||await sha(e[1].salt+pw)!==e[1].hash)throw new Error('badlogin');ss.set('jb.s',e[0]);return this.prof(e[0],e[1])},
  async signUp(p,pw){return this._make(p,pw,true)},
  async createAccount(p,pw){return this._make(p,pw,false)},
  async _make(p,pw,login){
    const db=this.load();if(Object.values(db.users).some(u=>u.email===p.email))throw new Error('exists');
    const id=uid(),salt=uid();db.users[id]={email:p.email,name:p.name,phone:p.phone||'',role:p.role||'client',salt,hash:await sha(salt+pw),...(p.thId?{thId:p.thId}:{})};
    this.save(db);this.pull(true);if(login)ss.set('jb.s',id);this.cb();return this.prof(id,db.users[id])},
  async restore(){const id=ss.get('jb.s'),db=this.load(),u=id&&db&&db.users[id];return u?this.prof(id,u):null},
  async signOut(){ss.del('jb.s')},
  async startSync(){this.pull(true)},
  /* data */
  async txn(fn){
    const run=async()=>{const db=this.load();
      const t={get:(c,id)=>db[c][id]?JSON.parse(JSON.stringify(db[c][id])):null,set:(c,id,o)=>{db[c][id]=JSON.parse(JSON.stringify(o))},del:(c,id)=>{delete db[c][id]}};
      const r=await fn(t);this.save(db);return r};                       // nothing is saved if fn throws
    const out=navigator.locks?await navigator.locks.request('jb-db',run):await run();this.pull();return out},
  async set(c,id,o){return this.txn(t=>t.set(c,id,o))},
  async update(c,id,p){return this.txn(async t=>{const o=await t.get(c,id);t.set(c,id,{...o,...p})})},
  async del(c,id){return this.txn(t=>t.del(c,id))},
  async uploadProof(owner,apptId,shrunk){return shrunk.url},
  async exportAll(){return this.load()},
  async importAll(o){COLS.forEach(c=>{if(typeof o[c]!=='object'||!o[c])throw new Error('badbackup')});this.save(o);this.pull()}
};

/* =====================================================================
   DATABASE ADAPTER 2: FIREBASE (Auth + Cloud Firestore + Cloud Storage)
   Loaded only when FIREBASE_CONFIG is filled in.
   ===================================================================== */
async function makeFirebase(cfg){
  const base='https://www.gstatic.com/firebasejs/10.14.1/firebase-';
  const [A,Au,F,St]=await Promise.all(['app','auth','firestore',...(USE_CLOUD_STORAGE?['storage']:[])].map(n=>import(base+n+'.js')));
  const app=A.initializeApp(cfg),auth=Au.getAuth(app),fs=F.getFirestore(app),st=USE_CLOUD_STORAGE?St.getStorage(app):null;
  const clean=o=>JSON.parse(JSON.stringify(o));
  let unsubs=[];const stop=()=>{unsubs.forEach(u=>u());unsubs=[]};
  const readProfile=async u=>{const s=await F.getDoc(F.doc(fs,'users',u.uid));return s.exists()?{uid:u.uid,email:u.email,...s.data()}:null};
  const self={
    mode:'firebase',cb:()=>{},on(fn){this.cb=fn},async init(){},
    async restore(){const u=await new Promise(r=>{const un=Au.onAuthStateChanged(auth,x=>{un();r(x)})});if(!u)return null;
      const p=await readProfile(u);if(!p)await Au.signOut(auth);return p},
    async signIn(em,pw){const c=await Au.signInWithEmailAndPassword(auth,em,pw);const p=await readProfile(c.user);
      if(!p){await Au.signOut(auth);throw new Error('noprofile')}return p},
    async signUp(p,pw){const c=await Au.createUserWithEmailAndPassword(auth,p.email,pw);
      const d={email:p.email,name:p.name,phone:p.phone||'',role:'client'};await F.setDoc(F.doc(fs,'users',c.user.uid),d);return{uid:c.user.uid,...d}},
    async createAccount(p,pw){                                           // admin makes staff/therapist logins without being signed out
      const a2=A.initializeApp(cfg,'sec'+Date.now()),au2=Au.getAuth(a2);
      const c=await Au.createUserWithEmailAndPassword(au2,p.email,pw);await Au.signOut(au2);
      await F.setDoc(F.doc(fs,'users',c.user.uid),clean({email:p.email,name:p.name,phone:'',role:p.role,thId:p.thId||null}));return c.user.uid},
    async signOut(){stop();await Au.signOut(auth)},
    startSync(p){
      stop();const emit=()=>self.cb(),C=n=>F.collection(fs,n);
      const L=(q,fn)=>unsubs.push(F.onSnapshot(q,fn,e=>{console.error(e);toast('Sync problem: '+(e.code||e.message))}));
      const list=(name,sort)=>s=>{D[name]=s.docs.map(d=>({id:d.id,...d.data()}));if(sort)D[name].sort(sort);emit()};
      L(C('services'),list('services'));L(C('therapists'),list('therapists'));
      L(F.query(C('slots'),F.where('date','>=',dkey(new Date()))),s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());D.slots=m;emit()});
      L(F.doc(fs,'settings','main'),s=>{D.settings={...DEFAULTS,...(s.data()||{})};emit()});
      const ap=p.role==='client'?F.query(C('appointments'),F.where('cid','==',p.uid)):p.role==='therapist'?F.query(C('appointments'),F.where('th','==',p.thId)):C('appointments');
      L(ap,list('appointments'));
      if(p.role==='client')L(F.query(C('notes'),F.where('to','==',p.uid)),list('notes',(a,b)=>b.t-a.t));
      if(p.role==='admin'){L(C('log'),list('log',(a,b)=>b.at-a.at));L(C('users'),list('users'))}
    },
    async txn(fn){return F.runTransaction(fs,tx=>fn({
      get:async(c,id)=>{const s=await tx.get(F.doc(fs,c,id));return s.exists()?s.data():null},      // all reads must come before writes
      set:(c,id,o)=>tx.set(F.doc(fs,c,id),clean(o)),del:(c,id)=>tx.delete(F.doc(fs,c,id))}))},
    async set(c,id,o){await F.setDoc(F.doc(fs,c,id),clean(o))},
    async update(c,id,p){await F.updateDoc(F.doc(fs,c,id),clean(p))},
    async del(c,id){await F.deleteDoc(F.doc(fs,c,id))},
    async uploadProof(owner,apptId,shrunk){if(!USE_CLOUD_STORAGE)return shrunk.url;        // small image stored in the booking record
      const r=St.ref(st,`proofs/${owner}/${apptId}/${Date.now()}.jpg`);
      await St.uploadBytes(r,shrunk.blob,{contentType:'image/jpeg'});return St.getDownloadURL(r)},
    async exportAll(){const out={};for(const c of['services','therapists','appointments','users','log','settings','slots']){
      const s=await F.getDocs(F.collection(fs,c));out[c]={};s.docs.forEach(d=>out[c][d.id]=d.data())}return out},
    async importAll(){throw new Error('Restore is only available in demo mode. Use the Firebase console to import data.')}
  };
  return self}

function tick(){

   <label for="tr">Home service travel time, each way (minutes)</label><input type="number" id="tr" value="${st.travelMin||0}"><p class="note">The early bird price applies Monday to Friday. A session that started by the last start time may finish after closing. Changing these does not cancel bookings that already exist.</p>
   <div class="tools" style="margin-top:12px"><button class="btn sm" onclick="saveSettings()">Save policy</button></div></section></div>
  <div><section class="panel"><h2>Therapists</h2>${D.therapists.map(t=>S.edit&&S.edit.k==='th'&&S.edit.id===t.id?`<div class="row" style="display:block"><label for="etn">Name</label><input type="text" id="etn" value="${esc(t.name)}"><label for="ets">Specialty</label><input type="text" id="ets" value="${esc(t.spec||'')}"><label>Weekly day off</label><div class="chips" id="eoff">${DAYN.map((d,i)=>`<label class="chip" style="display:inline-flex;gap:6px;align-items:center;margin:0"><input type="checkbox" value="${i}" ${(t.off||[]).includes(i)?'checked':''}> ${d}</label>`).join('')}</div><label for="etp">Photo (optional)</label><input type="file" id="etp" accept="image/*"><div class="tools" style="margin-top:8px"><button class="btn sm" onclick="saveTh('${t.id}')">Save</button><button class="btn sm ghost" onclick="editOff()">Cancel</button></div></div>`:`<div class="row"><div style="display:flex;gap:10px;align-items:center">${t.photo?`<img src="${esc(t.photo)}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover">`:''}<div><b>${esc(t.name)}</b><p>${esc(t.spec||'No specialty set')}${(t.off||[]).length?' · Day off: '+t.off.map(i=>DAYN[i]).join(', '):''}${t.on?'':' · inactive'}</p></div></div><div class="tools"><button class="btn sm ghost" onclick="editOn('th','${t.id}')">Edit</button><button class="btn sm ghost" onclick="flip('${t.id}')">${t.on?'Set inactive':'Set active'}</button></div></div>`).join('')||'<p class="empty">No therapists yet.</p>'}
   <label for="tn">Add a therapist</label><div class="tools" style="margin:0 0 8px"><input type="text" id="tn" placeholder="Name" style="flex:1"><input type="text" id="ts" placeholder="Specialty" style="flex:1"></div><button class="btn sm" onclick="addTh()">Add therapist</button></section>
  <section class="panel gap"><h2>Audit log</h2>${D.log.length?D.log.map(l=>`<div class="row"><div>${esc(l.a)}<p>${fmt(l.at)} · ${esc(l.by||'')} (${esc(l.role)})</p></div></div>`).join(''):'<p class="empty">Approvals, rejections, and other changes are recorded here.</p>'}</section></div></div>`+accPanel()+
  `<section class="panel gap"><h2>Backup</h2><p class="empty">Download a copy of all bookings, services, therapists, and settings.</p><div class="tools" style="margin-top:10px"><button class="btn sm" onclick="backup()">Download backup (JSON)</button>
   ${DB.mode==='local'?`<label class="btn sm ghost" style="display:inline-block;margin:0;cursor:pointer">Restore backup<input type="file" accept="application/json" hidden onchange="restoreFile(this)"></label>`:''}</div></section>`}
function banner(){
  if(S.fatal)return `<div class="banner err">${esc(S.fatal)}</div>`;
  return DB.mode==='local'?`<div class="banner">Demo mode: bookings are saved in this browser only, so they are not shared between devices. <button class="link" onclick="resetDemo()">Reset demo data</button></div>`
    :`<div class="banner ok">Connected to Firebase project ${esc(FIREBASE_CONFIG.projectId)}. Bookings update live on every device.</div>`}
function render(){
  const f=document.activeElement;S.dirty=false;
  if(!S.ready){return}
  $('#tabs').innerHTML=S.user?`<span>${esc(S.user.name)} · ${S.user.role}</span><button class="btn sm ghost" onclick="logOut()">Log out</button>`:'';
  if(!DB){$('#app').innerHTML=banner();return}
  $('#app').innerHTML=banner()+(S.user?{client,staff,therapist,admin}[S.user.role]():auth());tick()}
/* A live update from the database must not wipe what someone is typing */
function onData(){const a=document.activeElement;
  if(a&&a.closest&&a.closest('#app')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)){S.dirty=true;return}render()}
addEventListener('focusout',()=>{if(S.dirty)setTimeout(()=>{const a=document.activeElement;if(!(a&&a.closest&&a.closest('#app')&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)))render()},80)});

async function boot(){
  try{
    DB=FIREBASE_CONFIG?await makeFirebase(FIREBASE_CONFIG):Local;
    DB.on(onData);await DB.init();
    const p=await DB.restore();if(p){S.user=p;S.thView=p.thId||null;await DB.startSync(p)}
  }catch(e){console.error(e);S.fatal='Could not start the database: '+(e.message||e)+'. Check your Firebase settings, or set FIREBASE_CONFIG to null to use demo mode.';if(!DB)DB=Local}
  S.ready=true;render()}
boot();
</script>
</body>
</html>
